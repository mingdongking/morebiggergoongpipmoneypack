<style>
  :root{
    --paper:#EFEDE6;
    --paper-raised:rgba(255,255,255,0.55);
    --paper-raised-solid:#FFFFFF;
    --ink:#1C2B22;
    --ink-soft:#5B6B5F;
    --line:rgba(28,43,34,0.10);
    --glass-border:rgba(255,255,255,0.6);
    --joint:#2F5D4E;
    --joint-soft:rgba(47,93,78,0.14);
    --personal:#8B5E7A;
    --personal-soft:rgba(139,94,122,0.14);
    --gold:#C9A227;
    --gold-soft:rgba(201,162,39,0.16);
    --danger:#B5493B;
    --radius:18px;
    --blur:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;color:var(--ink);font-family:'Pretendard',sans-serif;
    background:
      radial-gradient(560px 420px at 8% 0%, rgba(47,93,78,0.30), transparent 60%),
      radial-gradient(620px 460px at 92% 12%, rgba(201,162,39,0.26), transparent 55%),
      radial-gradient(680px 520px at 30% 95%, rgba(139,94,122,0.24), transparent 60%),
      radial-gradient(680px 520px at 85% 90%, rgba(47,93,78,0.18), transparent 55%),
      var(--paper);
    background-attachment:fixed;
  }
  .display{font-family:'Pretendard',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #root{min-height:100vh;}
  .app{display:flex;min-height:100vh;}
  .rail{
    width:220px;flex-shrink:0;padding:28px 18px;display:flex;flex-direction:column;gap:4px;
    background:rgba(255,255,255,0.38);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
    backdrop-filter:blur(var(--blur)) saturate(160%);
    border-right:1px solid var(--glass-border);
  }
  .brand{font-family:'Pretendard',sans-serif;font-weight:700;font-size:16px;line-height:1.3;margin:0 8px 28px;color:var(--ink);}
  .brand span{color:var(--joint);}
  .navitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:14.5px;color:var(--ink-soft);transition:background .15s,color .15s;}
  .navitem:hover{background:rgba(255,255,255,0.5);}
  .navitem.active{background:var(--joint);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(47,93,78,0.35);}
  .main{flex:1;padding:36px 44px;max-width:1180px;}
  h1.page-title{font-family:'Pretendard',sans-serif;font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-soft);font-size:14px;margin:0 0 28px;}
  .card{
    background:var(--paper-raised);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    padding:22px;
    -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
    backdrop-filter:blur(var(--blur)) saturate(160%);
    box-shadow:0 8px 32px rgba(28,43,34,0.08);
  }
  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .stat-label{font-size:12.5px;color:var(--ink-soft);margin:0 0 6px;}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;margin:0;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:500;}
  .pill.joint{background:var(--joint-soft);color:var(--joint);}
  .pill.personal{background:var(--personal-soft);color:var(--personal);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px 8px;font-size:11.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.02em;}
  td{padding:11px 8px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .amount{font-family:'JetBrains Mono',monospace;text-align:right;font-weight:500;}
  button{font-family:'Pretendard',sans-serif;cursor:pointer;border:none;}
  .btn-primary{background:var(--joint);color:#fff;padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:500;}
  .btn-primary:hover{background:#25493d;}
  .btn-ghost{background:rgba(255,255,255,0.4);color:var(--ink-soft);padding:9px 14px;border-radius:11px;font-size:13px;border:1px solid var(--glass-border);}

  input,select,textarea{font-family:'Pretendard',sans-serif;border:1px solid var(--glass-border);border-radius:10px;padding:9px 11px;font-size:13.5px;background:rgba(255,255,255,0.55);color:var(--ink);width:100%;}

  label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:5px;}

  .modal{
    background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);border-radius:20px;padding:26px;width:440px;max-height:88vh;overflow:auto;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    box-shadow:0 20px 60px rgba(28,43,34,0.25);
  }
  .modal h2{font-family:'Pretendard',sans-serif;font-weight:700;font-size:19px;margin:0 0 18px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .display{font-size:17px;margin-bottom:6px;color:var(--ink);}
  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--paper-raised);font-size:13px;color:var(--ink-soft);}

  .csv-table{font-size:12.5px;}

  .map-select{width:100%;}

  .keyword-tag{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:12px;margin:2px 4px 2px 0;}
  .keyword-tag button{color:var(--ink-soft);font-size:13px;line-height:1;}
  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-name{flex:1;font-size:13.5px;font-weight:500;}

  /* ---------- 모바일 반응형 ---------- */
  @media (max-width: 760px){
    .app{flex-direction:column;}
    .rail{
      position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;z-index:60;
      flex-direction:column;align-items:stretch;
      padding:22px 16px;border-right:1px solid var(--glass-border);border-top:none;
      transform:translateX(-100%);transition:transform .25s ease;
      background:rgba(247,244,238,0.97);
      -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
      box-shadow:0 0 40px rgba(28,43,34,0.25);
    }
    .rail.mobile-open{transform:translateX(0);}
    .brand{display:block;font-size:16px;}
    .navitem{flex-direction:row;gap:10px;font-size:14px;padding:11px 12px;text-align:left;justify-content:flex-start;}
    .mobile-topbar{
      display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;
      padding:14px 16px;background:rgba(247,244,238,0.9);
      -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--glass-border);
    }
    .hamburger-btn{
      width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.6);
      border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    .mobile-backdrop{position:fixed;inset:0;background:rgba(28,43,34,0.35);z-index:55;}
    .main{padding:16px 16px 32px;max-width:100%;}
    h1.page-title{font-size:22px;}
    .grid-2,.grid-3,.row-2{grid-template-columns:1fr;}
    .modal{width:min(440px,92vw);padding:20px;}

    /* 테이블 -> 카드 리스트 전환 */
    table thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tr{margin-bottom:12px;border:1px solid var(--glass-border);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,0.45);}
    td{border-bottom:none;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right;}
    td[data-label]::before{content:attr(data-label);font-size:11px;color:var(--ink-soft);font-weight:500;text-align:left;}
    td.amount{text-align:right;}

    .csv-table tr{padding:8px 10px;}
    .filter-bar select{flex:1 1 45%;min-width:0;}
  }
  @media (min-width: 761px){
    .mobile-topbar{display:none;}
  }
</style>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef} = React;

// ---------- Supabase 설정 (여기 두 줄만 본인 프로젝트 값으로 교체하세요) ----------
const SUPABASE_URL = 'https://qphmjfzwesuujakjaybg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwaG1qZnp3ZXN1dWpha2pheWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MTcyODQsImV4cCI6MjEwMjQ5MzI4NH0.Ii25NJ19bef6btUhwk6mdH7EruOIW5VqbPY_K1voOq0';

// ---------- 입장 잠금 설정 (진짜 보안 아님, 가벼운 접근 차단용) ----------
// 결혼기념일을 8자리 숫자로 넣으세요 (예: 20240101). 주의: 이 값은 코드에 그대로 노출돼요.
const ANNIVERSARY_DATE = '20260328';

const DEFAULT_CATEGORIES = [
  {id:'housing',name:'주거/공과금',type:'joint',keywords:['관리비','도시가스','전기요금','수도요금','아파트']},
  {id:'grocery',name:'식비(장보기)',type:'joint',keywords:['마트','이마트','홈플러스','코스트코']},
  {id:'dining',name:'외식',type:'joint',keywords:['식당','배달','배민','요기요','카페','스타벅스']},
  {id:'telecom',name:'통신비',type:'joint',keywords:['SKT','KT','LG유플러스','통신']},
  {id:'insurance',name:'보험',type:'joint',keywords:['보험']},
  {id:'transport',name:'교통',type:'joint',keywords:['택시','주유','대중교통','지하철버스']},
  {id:'event',name:'경조사',type:'joint',keywords:['축의금','조의금']},
  {id:'saving',name:'저축/투자',type:'joint',keywords:['적금','펀드','증권']},
  {id:'shopping',name:'쇼핑',type:'personal',keywords:['쿠팡','네이버페이','올리브영']},
  {id:'hobby',name:'취미/여가',type:'personal',keywords:['영화관','넷플릭스','골프']},
  {id:'health',name:'의료/건강',type:'personal',keywords:['병원','약국']},
  {id:'selfdev',name:'자기계발',type:'personal',keywords:['서점','학원','강의']},
  {id:'etc',name:'기타',type:'personal',keywords:[]},
];

const WHO_OPTIONS = ['민경','희동'];

// ---- 로컬 폴백 (Supabase 미설정 시 지금까지처럼 브라우저 저장) ----
function loadLocal(){
  try{
    const raw = localStorage.getItem('ledger_state_v1');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {transactions:[], categories:DEFAULT_CATEGORIES};
}
function saveLocal(state){
  try{ localStorage.setItem('ledger_state_v1', JSON.stringify(state)); }catch(e){}
}

// ---- Supabase row <-> 앱 내부 객체 매핑 ----
function dbToTx(row){
  return {
    id:row.id, date:row.date, amount:Number(row.amount), categoryId:row.category_id, type:row.type, who:row.who, memo:row.memo, source:row.source,
    flow: row.flow || 'expense',
    paymentMethodId: row.payment_method_id || null,
    recurringExpenseId: row.recurring_expense_id || null,
    isInstallment: !!row.is_installment,
    installmentPrincipal: row.installment_principal!=null ? Number(row.installment_principal) : null,
    installmentTotalMonths: row.installment_total_months,
    installmentCurrentMonth: row.installment_current_month,
  };
}
function txToDb(t){
  return {
    id:t.id, date:t.date, amount:t.amount, category_id:t.flow==='income'?null:t.categoryId, type:t.flow==='income'?null:t.type, who:t.who, memo:t.memo, source:t.source,
    flow: t.flow || 'expense',
    payment_method_id: t.flow==='income' ? null : (t.paymentMethodId||null),
    recurring_expense_id: t.recurringExpenseId||null,
    is_installment: t.flow==='income' ? false : !!t.isInstallment,
    installment_principal: (t.flow!=='income' && t.isInstallment) ? (t.installmentPrincipal||null) : null,
    installment_total_months: (t.flow!=='income' && t.isInstallment) ? (t.installmentTotalMonths||null) : null,
    installment_current_month: (t.flow!=='income' && t.isInstallment) ? (t.installmentCurrentMonth||null) : null,
  };
}
function dbToCat(row){
  return {id:row.id, name:row.name, type:row.type, keywords:row.keywords||[]};
}
function dbToPM(row){
  return {
    id:row.id, name:row.name, type:row.type,
    closingDay: row.closing_day, paymentDay: row.payment_day,
    paymentOffsetMonths: row.payment_offset_months!=null ? row.payment_offset_months : 1,
    linkedAccount: row.linked_account,
    color: row.color, memo: row.memo,
  };
}
function pmToDb(p){
  return {
    id:p.id, name:p.name, type:p.type,
    closing_day: p.closingDay||null, payment_day: p.paymentDay||null,
    payment_offset_months: p.paymentOffsetMonths!=null ? p.paymentOffsetMonths : 1,
    linked_account: p.linkedAccount||null,
    color: p.color||null, memo: p.memo||null,
  };
}
function daysInMonth(year, monthIdx){ return new Date(year, monthIdx+1, 0).getDate(); }

// 카드의 이용마감일/결제일 기준으로 거래일이 실제 "출금되는 달(YYYY-MM)"을 계산
function getBillingMonthKey(dateStr, pm){
  if(!pm || pm.type==='cash' || !pm.closingDay || !pm.paymentDay) return monthKey(dateStr);
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDate();
  let cMonth = d.getMonth(), cYear = d.getFullYear();
  const closingEff = Math.min(pm.closingDay, daysInMonth(cYear,cMonth));
  if(day > closingEff){ cMonth += 1; if(cMonth>11){cMonth=0;cYear+=1;} }
  let pMonth = cMonth + (pm.paymentOffsetMonths!=null?pm.paymentOffsetMonths:1);
  let pYear = cYear;
  while(pMonth>11){pMonth-=12;pYear+=1;}
  return `${pYear}-${String(pMonth+1).padStart(2,'0')}`;
}
function dbToLoan(row){
  return {
    id:row.id, name:row.name,
    originalPrincipal: Number(row.original_principal),
    remainingPrincipal: Number(row.remaining_principal),
    monthlyPayment: row.monthly_payment!=null ? Number(row.monthly_payment) : null,
    interestRate: row.interest_rate!=null ? Number(row.interest_rate) : null,
    currentInstallment: row.current_installment,
    totalInstallments: row.total_installments,
    lastPaymentDate: row.last_payment_date,
    type: row.type, memo: row.memo,
  };
}
function loanToDb(l){
  return {
    id:l.id, name:l.name,
    original_principal: l.originalPrincipal,
    remaining_principal: l.remainingPrincipal,
    monthly_payment: l.monthlyPayment||null,
    interest_rate: l.interestRate||null,
    current_installment: l.currentInstallment||null,
    total_installments: l.totalInstallments||null,
    last_payment_date: l.lastPaymentDate||null,
    type: l.type||'joint', memo: l.memo||null,
    updated_at: new Date().toISOString(),
  };
}
function dbToAsset(row){
  return {
    id:row.id, name:row.name, assetType:row.type,
    currentValue: Number(row.current_value),
    principalInvested: row.principal_invested!=null ? Number(row.principal_invested) : null,
    asOfDate: row.as_of_date, scope: row.scope, memo: row.memo,
  };
}
function assetToDb(a){
  return {
    id:a.id, name:a.name, type:a.assetType,
    current_value: a.currentValue,
    principal_invested: a.principalInvested||null,
    as_of_date: a.asOfDate||null,
    scope: a.scope||'joint', memo: a.memo||null,
    updated_at: new Date().toISOString(),
  };
}
function dbToSnapshot(row){
  return { id:row.id, assetId:row.asset_id, date:row.date, value:Number(row.value) };
}
function snapshotToDb(s){
  return { id:s.id, asset_id:s.assetId, date:s.date, value:s.value };
}
const ASSET_TYPE_LABELS = { savings:'예적금', investment:'투자(주식/펀드)', cash:'현금성자산', other:'기타' };

function dbToRecurring(row){
  return {
    id:row.id, name:row.name, kind:row.kind, amount:Number(row.amount),
    categoryId: row.category_id, type: row.type, who: row.who,
    paymentMethodId: row.payment_method_id,
    totalMonths: row.total_months, paidCount: row.paid_count,
    lastPaidMonth: row.last_paid_month, active: row.active,
    originTransactionId: row.origin_transaction_id, memo: row.memo,
  };
}
function recurringToDb(r){
  return {
    id:r.id, name:r.name, kind:r.kind, amount:r.amount,
    category_id: r.categoryId||null, type: r.type||null, who: r.who||null,
    payment_method_id: r.paymentMethodId||null,
    total_months: r.kind==='installment' ? (r.totalMonths||null) : null,
    paid_count: r.paidCount||0,
    last_paid_month: r.lastPaidMonth||null,
    active: r.active!=null ? r.active : true,
    origin_transaction_id: r.originTransactionId||null,
    memo: r.memo||null,
  };
}

function fmtWon(n){
  const sign = n<0 ? '-' : '';
  return sign + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
}
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function guessCategory(desc, categories){
  if(!desc) return null;
  const lower = desc.toLowerCase();
  for(const c of categories){
    for(const kw of c.keywords){
      if(lower.includes(kw.toLowerCase())) return c.id;
    }
  }
  return null;
}

// ---------- Growth Ring (signature chart) ----------
function GrowthRing({rate, target}){
  const size=150, cx=size/2, cy=size/2, r=60, stroke=10;
  const circumference = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(1, rate/100));
  const targetPct = Math.max(0, Math.min(1, target/100));
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--line)" strokeWidth={stroke}/>
      <circle cx={cx} cy={cy} r={r-16} fill="none" stroke="var(--line)" strokeWidth={5} strokeDasharray="2 6" opacity="0.6"/>
      <circle
        cx={cx} cy={cy} r={r} fill="none" stroke="var(--gold)" strokeWidth={stroke}
        strokeDasharray={`${circumference*pct} ${circumference}`}
        strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`}
      />
      <line
        x1={cx} y1={cy-r-8} x2={cx} y2={cy-r+8}
        stroke="var(--ink-soft)" strokeWidth="2"
        transform={`rotate(${targetPct*360} ${cx} ${cy})`}
      />
      <text x={cx} y={cy-2} textAnchor="middle" className="mono" fontSize="22" fontWeight="600" fill="var(--ink)">{rate.toFixed(0)}%</text>
      <text x={cx} y={cy+16} textAnchor="middle" fontSize="11" fill="var(--ink-soft)">저축률</text>
    </svg>
  );
}

function AddTransactionModal({categories, paymentMethods, onClose, onSave, initial}){
  const defaults = {
    date: todayISO(), amount:'', categoryId: categories[0]?.id||'', type:'', who:WHO_OPTIONS[0], memo:'',
    flow:'expense', paymentMethodId: (paymentMethods&&paymentMethods[0]?.id) || 'cash',
    isInstallment:false, installmentPrincipal:'', installmentTotalMonths:'', installmentCurrentMonth:''
  };
  const [form,setForm]=useState(initial ? {
    ...defaults, ...initial,
    installmentPrincipal: initial.installmentPrincipal ?? '',
    installmentTotalMonths: initial.installmentTotalMonths ?? '',
    installmentCurrentMonth: initial.installmentCurrentMonth ?? '',
  } : defaults);
  const selectedCat = categories.find(c=>c.id===form.categoryId);
  const effectiveType = form.type || (selectedCat?selectedCat.type:'joint');

  function update(k,v){ setForm(f=>({...f,[k]:v})); }

  function submit(){
    if(!form.amount || !form.date) return;
    if(form.flow==='expense' && form.isInstallment && (!form.installmentTotalMonths || !form.installmentCurrentMonth)) return;
    onSave({
      id: initial?initial.id: 'tx_'+Date.now()+Math.random().toString(36).slice(2,7),
      date: form.date,
      amount: Number(form.amount),
      categoryId: form.flow==='income' ? null : form.categoryId,
      type: form.flow==='income' ? null : effectiveType,
      who: form.who,
      memo: form.memo,
      source: initial?initial.source:'manual',
      flow: form.flow,
      paymentMethodId: form.flow==='income' ? null : form.paymentMethodId,
      isInstallment: form.flow==='expense' && form.isInstallment,
      installmentPrincipal: (form.flow==='expense' && form.isInstallment) ? Number(form.installmentPrincipal||0) : null,
      installmentTotalMonths: (form.flow==='expense' && form.isInstallment) ? Number(form.installmentTotalMonths) : null,
      installmentCurrentMonth: (form.flow==='expense' && form.isInstallment) ? Number(form.installmentCurrentMonth) : null,
    });
  }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>{initial?'거래 수정':'거래 추가'}</h2>
        <div className="field">
          <div className="toggle-row">
            <button type="button" className={"toggle-btn"+(form.flow==='expense'?' active-personal':'')} onClick={()=>update('flow','expense')}>지출</button>
            <button type="button" className={"toggle-btn"+(form.flow==='income'?' active-joint':'')} onClick={()=>update('flow','income')}>수입</button>
          </div>
        </div>
        <div className="row-2">
          <div className="field">
            <label>날짜</label>
            <input type="date" value={form.date} onChange={e=>update('date',e.target.value)}/>
          </div>
          <div className="field">
            <label>금액 (원)</label>
            <input type="number" placeholder="15000" value={form.amount} onChange={e=>update('amount',e.target.value)}/>
          </div>
        </div>
        {form.flow==='expense' && (
        <React.Fragment>
        <div className="field">
          <label>카테고리</label>
          <select value={form.categoryId} onChange={e=>setForm(f=>({...f, categoryId:e.target.value, type:''}))}>
            {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
        <div className="field">
          <label>공동 / 개인 (기본값에서 변경 가능)</label>
          <div className="toggle-row">
            <button type="button" className={"toggle-btn"+(effectiveType==='joint'?' active-joint':'')} onClick={()=>update('type','joint')}>공동</button>
            <button type="button" className={"toggle-btn"+(effectiveType==='personal'?' active-personal':'')} onClick={()=>update('type','personal')}>개인</button>
          </div>
        </div>
        <div className="field">
          <label>결제수단</label>
          <select value={form.paymentMethodId} onChange={e=>update('paymentMethodId', e.target.value)}>
            {(paymentMethods||[]).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        </React.Fragment>
        )}
        {form.flow==='income' && (
          <div className="field">
            <label>수입 종류</label>
            <input value={form.memo} onChange={e=>update('memo',e.target.value)} placeholder="예: 월급, 상여금, 부수입"/>
          </div>
        )}
        <div className="field">
          <label>입력자</label>
          <select value={form.who} onChange={e=>update('who',e.target.value)}>
            {WHO_OPTIONS.map(w=><option key={w} value={w}>{w}</option>)}
          </select>
        </div>
        {form.flow==='expense' && (
        <div className="field">
          <label>메모</label>
          <input value={form.memo} onChange={e=>update('memo',e.target.value)} placeholder="선택 입력"/>
        </div>
        )}

        {form.flow==='expense' && (
        <div className="field">
          <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
            <input type="checkbox" style={{width:'auto'}} checked={form.isInstallment} onChange={e=>update('isInstallment', e.target.checked)}/>
            할부 결제예요 (일회성 기록용)
          </label>
          <p style={{fontSize:11,color:'var(--ink-soft)',marginTop:4}}>매달 반복 관리하려면 "고정지출/할부 관리" 탭에서 등록하는 걸 추천해요.</p>
        </div>
        )}

        {form.flow==='expense' && form.isInstallment && (
          <div style={{background:'var(--paper)',borderRadius:10,padding:'12px 14px',marginBottom:14}}>
            <p style={{fontSize:11.5,color:'var(--ink-soft)',marginBottom:10}}>위 "금액"은 이번 달에 실제로 청구된 할부금이에요. 아래는 할부 전체 정보예요.</p>
            <div className="field">
              <label>원금 (할부 총 금액)</label>
              <input type="number" placeholder="예: 600000" value={form.installmentPrincipal} onChange={e=>update('installmentPrincipal', e.target.value)}/>
            </div>
            <div className="row-2">
              <div className="field">
                <label>총 할부 개월</label>
                <input type="number" min="1" placeholder="예: 12" value={form.installmentTotalMonths} onChange={e=>update('installmentTotalMonths', e.target.value)}/>
              </div>
              <div className="field">
                <label>현재 몇 회차</label>
                <input type="number" min="1" placeholder="예: 3" value={form.installmentCurrentMonth} onChange={e=>update('installmentCurrentMonth', e.target.value)}/>
              </div>
            </div>
          </div>
        )}
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:20}}>
          <button className="btn-ghost" onClick={onClose}>취소</button>
          <button className="btn-primary" onClick={submit}>저장</button>
        </div>
      </div>
    </div>
  );
}

function Dashboard({transactions, categories, loans, paymentMethods, assets, recurringExpenses}){
  const [viewMode,setViewMode] = useState('purchase'); // 'purchase' | 'billing'
  const [periodPreset,setPeriodPreset] = useState('thisMonth');
  const [periodFrom,setPeriodFrom] = useState('');
  const [periodTo,setPeriodTo] = useState('');
  const now = new Date();
  const curMonth = now.toISOString().slice(0,7);
  const pmMap = {};
  (paymentMethods||[]).forEach(p=>{ pmMap[p.id]=p; });

  function effectiveMonthKey(t){
    if(viewMode==='purchase' || t.flow==='income') return monthKey(t.date);
    return getBillingMonthKey(t.date, pmMap[t.paymentMethodId]);
  }

  function presetRangeDash(preset){
    const y=now.getFullYear(), m=now.getMonth();
    const fmt = d=>d.toISOString().slice(0,10);
    if(preset==='thisMonth') return {from:fmt(new Date(y,m,1)), to:fmt(new Date(y,m+1,0))};
    if(preset==='lastMonth') return {from:fmt(new Date(y,m-1,1)), to:fmt(new Date(y,m,0))};
    if(preset==='last3') return {from:fmt(new Date(y,m-2,1)), to:fmt(new Date(y,m+1,0))};
    if(preset==='last6') return {from:fmt(new Date(y,m-5,1)), to:fmt(new Date(y,m+1,0))};
    if(preset==='thisYear') return {from:fmt(new Date(y,0,1)), to:fmt(new Date(y,11,31))};
    return {from:'', to:''}; // 'all'
  }
  const activeRange = periodPreset==='custom' ? {from:periodFrom, to:periodTo} : presetRangeDash(periodPreset);
  const fromKey = activeRange.from ? monthKey(activeRange.from) : null;
  const toKey = activeRange.to ? monthKey(activeRange.to) : null;

  const periodLabel = (()=>{
    if(periodPreset==='thisMonth') return `${curMonth} (이번 달)`;
    if(periodPreset==='lastMonth') return '지난 달';
    if(periodPreset==='last3') return '최근 3개월';
    if(periodPreset==='last6') return '최근 6개월';
    if(periodPreset==='thisYear') return `${now.getFullYear()}년 전체`;
    if(periodPreset==='all') return '전체 기간';
    if(periodPreset==='custom') return `${periodFrom||'?'} ~ ${periodTo||'?'}`;
    return curMonth;
  })();

  const monthTx = transactions.filter(t=>{
    const k = effectiveMonthKey(t);
    if(fromKey && k<fromKey) return false;
    if(toKey && k>toKey) return false;
    return true;
  });
  const monthExpenseTx = monthTx.filter(t=>(t.flow||'expense')==='expense');
  const monthIncomeTx = monthTx.filter(t=>t.flow==='income');

  const totalOut = monthExpenseTx.reduce((s,t)=>s+t.amount,0);
  const totalIncome = monthIncomeTx.reduce((s,t)=>s+t.amount,0);
  const jointOut = monthExpenseTx.filter(t=>t.type==='joint').reduce((s,t)=>s+t.amount,0);
  const personalOut = monthExpenseTx.filter(t=>t.type==='personal').reduce((s,t)=>s+t.amount,0);
  const netThisMonth = totalIncome - totalOut;

  const hasIncomeData = totalIncome>0;
  const savingTx = monthExpenseTx.filter(t=>t.categoryId==='saving').reduce((s,t)=>s+t.amount,0);
  const savingsRate = hasIncomeData
    ? (netThisMonth/totalIncome*100)
    : (totalOut>0 ? (savingTx/totalOut*100) : 0);

  const byCategory = {};
  monthExpenseTx.forEach(t=>{
    byCategory[t.categoryId] = (byCategory[t.categoryId]||0)+t.amount;
  });
  const catRanked = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const catName = id => categories.find(c=>c.id===id)?.name || id;

  // 할부 현황 (전체 거래 기준, 진행중인 것만 — 마이그레이션 안 된 레거시 항목용)
  const activeInstallments = transactions.filter(t=>
    (t.flow||'expense')==='expense' && t.isInstallment && t.installmentTotalMonths && t.installmentCurrentMonth
  );
  const installmentSummary = activeInstallments.map(t=>{
    const remainingMonths = Math.max(t.installmentTotalMonths - t.installmentCurrentMonth, 0);
    return { ...t, remainingMonths, remainingAmount: remainingMonths * t.amount, nextMonthDue: remainingMonths>=1 ? t.amount : 0 };
  });
  const totalInstallmentRemaining = installmentSummary.reduce((s,t)=>s+t.remainingAmount,0);
  const totalNextMonthInstallment = installmentSummary.reduce((s,t)=>s+t.nextMonthDue,0);

  // 고정지출/할부 관리 탭 기준 활성 항목
  const activeRecurring = (recurringExpenses||[]).filter(r=>r.active);
  const recurringMonthlyTotal = activeRecurring.reduce((s,r)=>s+r.amount,0);
  const curMonthKeyNow = new Date().toISOString().slice(0,7);
  const recurringPaidThisMonth = activeRecurring.filter(r=>r.lastPaidMonth===curMonthKeyNow).length;

  // 다음 달 예상 고정 지출 (레거시 할부 + 고정지출/할부 관리 항목 + 대출 월납입액)
  const nextMonthLoanPayment = (loans||[]).reduce((s,l)=>s+(l.monthlyPayment||0),0);
  const nextMonthFixedTotal = totalNextMonthInstallment + recurringMonthlyTotal + nextMonthLoanPayment;

  // 저축 시뮬레이션
  const [simMonthly,setSimMonthly] = useState(null);
  const monthlySavingBase = hasIncomeData ? Math.max(netThisMonth,0) : 0;
  const simValue = simMonthly!=null ? simMonthly : monthlySavingBase;
  const projPeriods = [3,6,12];

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:10,marginBottom:10}}>
        <div>
          <h1 className="page-title" style={{marginBottom:6}}>대시보드</h1>
          <p className="subtitle" style={{margin:0}}>{periodLabel} 기준 우리 집 돈 흐름</p>
        </div>
        <div className="toggle-row" style={{width:'auto',maxWidth:280}}>
          <button type="button" className={"toggle-btn"+(viewMode==='purchase'?' active-joint':'')} onClick={()=>setViewMode('purchase')}>구매일 기준</button>
          <button type="button" className={"toggle-btn"+(viewMode==='billing'?' active-joint':'')} onClick={()=>setViewMode('billing')}>출금일 기준</button>
        </div>
      </div>

      <div className="filter-bar" style={{marginBottom:8}}>
        <select value={periodPreset} onChange={e=>setPeriodPreset(e.target.value)}>
          <option value="thisMonth">이번 달</option>
          <option value="lastMonth">지난 달</option>
          <option value="last3">최근 3개월</option>
          <option value="last6">최근 6개월</option>
          <option value="thisYear">올해</option>
          <option value="all">전체 기간</option>
          <option value="custom">기간 직접 지정</option>
        </select>
        {periodPreset==='custom' && (
          <React.Fragment>
            <input type="date" value={periodFrom} onChange={e=>setPeriodFrom(e.target.value)} style={{width:'auto'}}/>
            <span style={{color:'var(--ink-soft)',fontSize:13}}>~</span>
            <input type="date" value={periodTo} onChange={e=>setPeriodTo(e.target.value)} style={{width:'auto'}}/>
          </React.Fragment>
        )}
      </div>

      <p style={{fontSize:11.5,color:'var(--ink-soft)',marginBottom:20}}>
        {viewMode==='purchase' ? '실제 구매/사용한 날짜 기준으로 집계해요.' : '카드 결제수단에 등록된 이용마감일/결제일 기준으로, 실제 통장에서 빠져나가는 달로 집계해요.'}
      </p>

      <div className="grid-3" style={{marginBottom:20}}>
        <div className="card">
          <p className="stat-label">수입</p>
          <p className="stat-value" style={{color:'var(--joint)'}}>{fmtWon(totalIncome)}</p>
        </div>
        <div className="card">
          <p className="stat-label">지출</p>
          <p className="stat-value">{fmtWon(totalOut)}</p>
        </div>
        <div className="card">
          <p className="stat-label">순 저축액</p>
          <p className="stat-value" style={{color: netThisMonth>=0 ? 'var(--joint)':'var(--danger)'}}>{fmtWon(netThisMonth)}</p>
        </div>
      </div>

      <div className="grid-2" style={{marginBottom:20}}>
        <div className="card">
          <div className="grid-2" style={{gridTemplateColumns:'1fr 1fr',marginBottom:4}}>
            <div>
              <p className="stat-label">공동 지출 <span className="pill joint" style={{marginLeft:4}}>공동</span></p>
              <p className="stat-value" style={{color:'var(--joint)',fontSize:20}}>{fmtWon(jointOut)}</p>
            </div>
            <div>
              <p className="stat-label">개인 지출 <span className="pill personal" style={{marginLeft:4}}>개인</span></p>
              <p className="stat-value" style={{color:'var(--personal)',fontSize:20}}>{fmtWon(personalOut)}</p>
            </div>
          </div>
          <div style={{marginTop:18}}>
            <p className="stat-label" style={{marginBottom:8}}>카테고리 TOP 5</p>
            {catRanked.length===0 && <p style={{fontSize:13,color:'var(--ink-soft)'}}>선택한 기간에 기록된 지출이 없어요.</p>}
            {catRanked.map(([id,amt])=>{
              const pct = totalOut>0? (amt/totalOut*100):0;
              return (
                <div key={id} style={{marginBottom:9}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,marginBottom:4}}>
                    <span>{catName(id)}</span>
                    <span className="mono">{fmtWon(amt)}</span>
                  </div>
                  <div style={{height:6,background:'var(--line)',borderRadius:99}}>
                    <div style={{height:6,width:pct+'%',background:'var(--joint)',borderRadius:99}}></div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="card" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
          <GrowthRing rate={savingsRate} target={30}/>
          <p style={{fontSize:12,color:'var(--ink-soft)',textAlign:'center',marginTop:10,lineHeight:1.5}}>
            {hasIncomeData
              ? <React.Fragment>선택 기간 수입 대비<br/>실제 저축률이에요</React.Fragment>
              : <React.Fragment>저축/투자 카테고리 지출이<br/>전체 지출에서 차지하는 비중<br/><span style={{fontSize:11}}>(수입을 입력하면 진짜 저축률로 바뀌어요)</span></React.Fragment>}
          </p>
        </div>
      </div>

      {nextMonthFixedTotal>0 && (
        <div className="card" style={{marginBottom:20}}>
          <p className="stat-label" style={{marginBottom:10}}>다음 달 예상 고정 지출 (고정지출/할부 + 대출 상환)</p>
          <div className="grid-3">
            <div>
              <p className="stat-label">고정지출/할부</p>
              <p className="stat-value" style={{fontSize:19}}>{fmtWon(recurringMonthlyTotal+totalNextMonthInstallment)}</p>
            </div>
            <div>
              <p className="stat-label">대출 상환</p>
              <p className="stat-value" style={{fontSize:19}}>{fmtWon(nextMonthLoanPayment)}</p>
            </div>
            <div>
              <p className="stat-label">합계</p>
              <p className="stat-value" style={{fontSize:19,color:'var(--personal)'}}>{fmtWon(nextMonthFixedTotal)}</p>
            </div>
          </div>
          <p style={{fontSize:11.5,color:'var(--ink-soft)',marginTop:10}}>이 금액은 예상치예요. 고정지출/할부 관리 탭에서 "납부 처리"를 누르면 실제 거래로 자동 기록돼요.</p>
        </div>
      )}

      {activeRecurring.length>0 && (
        <div className="card" style={{marginBottom:20}}>
          <p className="stat-label" style={{marginBottom:10}}>이번 달 고정지출/할부 처리 현황</p>
          <p className="stat-value" style={{fontSize:22,marginBottom:10}}>{recurringPaidThisMonth}/{activeRecurring.length}건 완료</p>
          {activeRecurring.filter(r=>r.lastPaidMonth!==curMonthKeyNow).map(r=>(
            <div key={r.id} style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'5px 0',borderBottom:'1px solid var(--line)'}}>
              <span>{r.name}</span>
              <span className="mono" style={{color:'var(--danger)'}}>미처리 · {fmtWon(r.amount)}</span>
            </div>
          ))}
        </div>

                  <td data-label="카테고리">{isIncome?'수입':catName(t.categoryId)}</td>

}

function Transactions({transactions, categories, paymentMethods, onAdd, onEdit, onDelete}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [filterCat,setFilterCat]=useState('all');
  const [filterType,setFilterType]=useState('all');
  const [filterWho,setFilterWho]=useState('all');
  const [filterFlow,setFilterFlow]=useState('all');
  const [filterPM,setFilterPM]=useState('all');
  const [datePreset,setDatePreset]=useState('all');
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');

  const catName = id => categories.find(c=>c.id===id)?.name || id;
  const pmName = id => (paymentMethods||[]).find(p=>p.id===id)?.name || null;

  function presetRange(preset){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const fmt = d => d.toISOString().slice(0,10);
    if(preset==='thisMonth') return {from:fmt(new Date(y,m,1)), to:fmt(new Date(y,m+1,0))};
    if(preset==='lastMonth') return {from:fmt(new Date(y,m-1,1)), to:fmt(new Date(y,m,0))};
    if(preset==='last3') return {from:fmt(new Date(y,m-2,1)), to:fmt(new Date(y,m+1,0))};
    if(preset==='last6') return {from:fmt(new Date(y,m-5,1)), to:fmt(new Date(y,m+1,0))};
    if(preset==='thisYear') return {from:fmt(new Date(y,0,1)), to:fmt(new Date(y,11,31))};
    return {from:'', to:''};
  }
  const activeRange = datePreset==='custom' ? {from:dateFrom, to:dateTo} : presetRange(datePreset);

  const filtered = transactions.filter(t=>
    (filterCat==='all'||t.categoryId===filterCat) &&
    (filterType==='all'||t.type===filterType) &&
    (filterWho==='all'||t.who===filterWho) &&
    (filterFlow==='all'||(t.flow||'expense')===filterFlow) &&
    (filterPM==='all'||t.paymentMethodId===filterPM) &&
    (!activeRange.from || t.date>=activeRange.from) &&
    (!activeRange.to || t.date<=activeRange.to)
  ).sort((a,b)=>b.date.localeCompare(a.date));

  const periodTotal = filtered.filter(t=>(t.flow||'expense')==='expense').reduce((s,t)=>s+t.amount,0);

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20}}>
        <div>
          <h1 className="page-title">거래 내역</h1>
          <p className="subtitle" style={{margin:0}}>
            총 {transactions.length}건
            {datePreset!=='all' && ` · 조회 기간 지출 합계 ${fmtWon(periodTotal)}`}
          </p>
        </div>
        <button className="btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>+ 거래 추가</button>
      </div>

      <div className="filter-bar">
        <select value={datePreset} onChange={e=>setDatePreset(e.target.value)}>
          <option value="all">전체 기간</option>
          <option value="thisMonth">이번 달</option>
          <option value="lastMonth">지난 달</option>
          <option value="last3">최근 3개월</option>
          <option value="last6">최근 6개월</option>
          <option value="thisYear">올해</option>
          <option value="custom">기간 직접 지정</option>
        </select>
        {datePreset==='custom' && (
          <React.Fragment>
            <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={{width:'auto'}}/>
            <span style={{color:'var(--ink-soft)',fontSize:13}}>~</span>
            <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={{width:'auto'}}/>
          </React.Fragment>
        )}
        <select value={filterFlow} onChange={e=>setFilterFlow(e.target.value)}>
          <option value="all">수입/지출 전체</option>
          <option value="expense">지출</option>
          <option value="income">수입</option>
        </select>
        <select value={filterCat} onChange={e=>setFilterCat(e.target.value)}>
          <option value="all">전체 카테고리</option>
          {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select value={filterType} onChange={e=>setFilterType(e.target.value)}>
          <option value="all">공동/개인 전체</option>
          <option value="joint">공동</option>
          <option value="personal">개인</option>
        </select>
        <select value={filterWho} onChange={e=>setFilterWho(e.target.value)}>
          <option value="all">입력자 전체</option>
          {WHO_OPTIONS.map(w=><option key={w} value={w}>{w}</option>)}
        </select>
        <select value={filterPM} onChange={e=>setFilterPM(e.target.value)}>
          <option value="all">결제수단 전체</option>
          {(paymentMethods||[]).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>

      <div className="card">
        {filtered.length===0 ? (
          <div className="empty">
            <p className="display">조건에 맞는 거래가 없어요</p>
          </div>
        ) : (
          <table>
            <thead>
              <tr><th>날짜</th><th>카테고리</th><th>구분</th><th>결제수단</th><th>입력자</th><th>메모</th><th style={{textAlign:'right'}}>금액</th><th></th></tr>
            </thead>
            <tbody>
              {filtered.map(t=>{
                const isIncome = t.flow==='income';
                return (
                <tr key={t.id}>
                  <td className="mono" data-label="날짜">{t.date}</td>
                  <td data-label="카테고리">{isIncome ? '수입' : catName(t.categoryId)}</td>
                  <td data-label="구분">
                    {isIncome
                      ? <span className="pill" style={{background:'var(--gold-soft)',color:'#8a6d10'}}>수입</span>
                      : <span className={"pill "+t.type}>{t.type==='joint'?'공동':'개인'}</span>}
                  </td>
                  <td data-label="결제수단">{isIncome ? '—' : (pmName(t.paymentMethodId) || '—')}</td>
                  <td data-label="입력자">{t.who}</td>
                  <td data-label="메모" style={{color:'var(--ink-soft)'}}>
                    {t.memo||'—'}
                    {t.isInstallment && (
                      <span className="pill" style={{background:'var(--gold-soft)',color:'#8a6d10',marginLeft:6}}>
                        할부 {t.installmentCurrentMonth}/{t.installmentTotalMonths}회
                        {t.installmentPrincipal ? ` · 원금 ${fmtWon(t.installmentPrincipal)}` : ''}
                      </span>
                    )}
                  </td>
                  <td className="amount" data-label="금액" style={{color:isIncome?'var(--joint)':'var(--ink)'}}>{isIncome?'+':''}{fmtWon(t.amount)}</td>
                  <td data-label="관리" style={{whiteSpace:'nowrap'}}>
                    <button className="btn-icon" onClick={()=>{setEditing(t);setShowModal(true);}}>수정</button>
                    <button className="btn-icon" onClick={()=>{ if(window.confirm('이 거래를 삭제할까요?')) onDelete(t.id); }}>삭제</button>
                  </td>
                </tr>
              );})}
            </tbody>
          </table>
        )}
      </div>

      {showModal && (
        <AddTransactionModal
          categories={categories}
          paymentMethods={paymentMethods}
          initial={editing}
          onClose={()=>setShowModal(false)}
          onSave={(tx)=>{ editing?onEdit(tx):onAdd(tx); setShowModal(false); }}
        />
      )}
    </div>
  );
}

function CsvUpload({categories, paymentMethods, onImport}){
  const [rawFile,setRawFile]=useState(null);
  const [encoding,setEncoding]=useState('utf-8');
  const [skipRows,setSkipRows]=useState(0);
  const [garbledWarning,setGarbledWarning]=useState(false);
  const [rows,setRows]=useState(null); // raw parsed rows
  const [headers,setHeaders]=useState([]);
  const [mapping,setMapping]=useState({date:'',amount:'',desc:''});
  const [preview,setPreview]=useState([]);
  const [batchWho,setBatchWho]=useState(WHO_OPTIONS[0]);
  const [batchPM,setBatchPM]=useState((paymentMethods&&paymentMethods[0]?.id)||'cash');
  const fileRef = useRef(null);

  function parseWithSettings(file, enc, skip){
    const isExcel = /\.(xlsx|xls)$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = (e)=>{
      let text;
      if(isExcel){
        try{
          const wb = XLSX.read(e.target.result, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          text = XLSX.utils.sheet_to_csv(sheet);
          setGarbledWarning(false);
        }catch(err){
          alert('엑셀 파일을 읽는 중 문제가 발생했어요. 파일이 손상되지 않았는지 확인해주세요.');
          return;
        }
      }else{
        try{ text = new TextDecoder(enc).decode(e.target.result); }
        catch(err){ text = new TextDecoder('utf-8').decode(e.target.result); }
        const garbledCount = (text.match(/\uFFFD/g)||[]).length;
        setGarbledWarning(garbledCount > 3);
      }

      const lines = text.split(/\r\n|\n|\r/);
      const sliced = lines.slice(skip).join('\n');

      Papa.parse(sliced, {
        header:true,
        skipEmptyLines:true,
        complete: (res)=>{
          const fields = res.meta.fields||[];
          setHeaders(fields);
          setRows(res.data);
          const guess = (cands)=> fields.find(f=>cands.some(c=>f.includes(c))) || '';
          setMapping({
            date: guess(['날짜','일자','date','Date','거래일']),
            amount: guess(['금액','출금','amount','Amount','승인금액','이용금액']),
            desc: guess(['내용','가맹점','적요','description','Description','가맹점명'])
          });
        }
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    setRawFile(file);
    parseWithSettings(file, encoding, skipRows);
  }

  function reparse(){
    if(rawFile) parseWithSettings(rawFile, encoding, skipRows);
  }

  function buildPreview(){
    if(!rows) return;
    const built = rows.map((r,i)=>{
      const rawAmount = (r[mapping.amount]||'0').toString().replace(/[^0-9.-]/g,'');
      const amount = Math.abs(Number(rawAmount)||0);
      const desc = r[mapping.desc]||'';
      const guessedCat = guessCategory(desc, categories) || 'etc';
      const cat = categories.find(c=>c.id===guessedCat);
      return {
        _rowId: 'csv_'+i,
        date: r[mapping.date]||'',
        amount,
        desc,
        categoryId: guessedCat,
        type: cat?cat.type:'personal',
        who: batchWho,
        paymentMethodId: batchPM,
        include: true,
      };
    }).filter(r=>r.amount>0);
    setPreview(built);
  }

  function updatePreviewRow(idx, patch){
    setPreview(p=>p.map((r,i)=>i===idx?{...r,...patch}:r));
  }

  function confirmImport(){
    const toImport = preview.filter(r=>r.include).map(r=>({
      id:'tx_'+Date.now()+Math.random().toString(36).slice(2,7),
      date:r.date, amount:r.amount, categoryId:r.categoryId, type:r.type, who:r.who, paymentMethodId:r.paymentMethodId, memo:r.desc, source:'csv'
    }));
    onImport(toImport);
    setRows(null); setPreview([]); setHeaders([]); setRawFile(null);
    if(fileRef.current) fileRef.current.value='';
  }

  return (
    <div>
      <h1 className="page-title">CSV / 엑셀 업로드</h1>
      <p className="subtitle">은행/카드 CSV나 엑셀(xlsx)을 업로드하고 컬럼을 매핑하면, 이후엔 같은 형식을 자동 인식해요.</p>

      <div className="card" style={{marginBottom:16}}>
        <p className="stat-label" style={{marginBottom:10}}>이 파일은 누구/어떤 결제수단 내역인가요?</p>
        <div className="row-2">
          <div className="field" style={{marginBottom:0}}>
            <label>입력자</label>
            <select value={batchWho} onChange={e=>setBatchWho(e.target.value)}>
              {WHO_OPTIONS.map(w=><option key={w} value={w}>{w}</option>)}
            </select>
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label>결제수단</label>
            <select value={batchPM} onChange={e=>setBatchPM(e.target.value)}>
              {(paymentMethods||[]).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
        <p style={{fontSize:11.5,color:'var(--ink-soft)',marginTop:8}}>여기서 정한 값이 아래 미리보기의 각 행 기본값으로 들어가요. 필요하면 미리보기에서 행별로 다시 바꿀 수 있어요.</p>
      </div>

      {!rows && (
        <div className="card" style={{textAlign:'center',padding:'44px 20px'}}>
          <p className="display" style={{fontSize:17,marginBottom:8}}>CSV 또는 엑셀 파일을 선택하세요</p>
          <p style={{fontSize:13,color:'var(--ink-soft)',marginBottom:18}}>카드사 "이용내역" 다운로드는 보통 엑셀(xlsx)로 나와요 — 그대로 올리시면 돼요.</p>
          <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{maxWidth:280,margin:'0 auto'}}/>
          <div className="row-2" style={{maxWidth:360,margin:'22px auto 0',textAlign:'left'}}>
            <div className="field" style={{marginBottom:0}}>
              <label>인코딩 (CSV만 해당)</label>
              <select value={encoding} onChange={e=>{setEncoding(e.target.value); if(rawFile) parseWithSettings(rawFile, e.target.value, skipRows);}}>
                <option value="utf-8">UTF-8 (기본)</option>
                <option value="euc-kr">EUC-KR (구형 은행/카드 CSV)</option>
              </select>
            </div>
            <div className="field" style={{marginBottom:0}}>
              <label>상단 건너뛸 줄 수</label>
              <input type="number" min="0" value={skipRows} onChange={e=>{const v=Number(e.target.value)||0; setSkipRows(v); if(rawFile) parseWithSettings(rawFile, encoding, v);}}/>
            </div>
          </div>
          <p style={{fontSize:11.5,color:'var(--ink-soft)',marginTop:10}}>카드/은행 명세서는 표 위에 안내 문구가 몇 줄 있는 경우가 많아요. CSV인데 글자가 깨지면 인코딩을 EUC-KR로 바꿔보세요.</p>
        </div>
      )}

      {rows && preview.length===0 && (
        <div className="card">
          <p className="stat-label" style={{marginBottom:12}}>컬럼 매핑 ({headers.length}개 컬럼 인식됨)</p>
          {garbledWarning && (
            <div style={{background:'var(--gold-soft)',border:'1px solid var(--gold)',borderRadius:10,padding:'10px 12px',marginBottom:14,fontSize:12.5,color:'#8a6d10'}}>
              글자가 깨져 보이면 인코딩이 안 맞는 걸 수 있어요. 아래에서 EUC-KR로 바꿔서 다시 읽어보세요.
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <select value={encoding} onChange={e=>{setEncoding(e.target.value); parseWithSettings(rawFile, e.target.value, skipRows);}} style={{width:'auto'}}>
                  <option value="utf-8">UTF-8</option>
                  <option value="euc-kr">EUC-KR</option>
                </select>
              </div>
            </div>
          )}
          <div className="row-2" style={{marginBottom:12}}>
            <div className="field">
              <label>날짜 컬럼</label>
              <select className="map-select" value={mapping.date} onChange={e=>setMapping(m=>({...m,date:e.target.value}))}>
                <option value="">선택</option>
                {headers.map(h=><option key={h} value={h}>{h}</option>)}
              </select>
            </div>
            <div className="field">
              <label>금액 컬럼</label>
              <select className="map-select" value={mapping.amount} onChange={e=>setMapping(m=>({...m,amount:e.target.value}))}>
                <option value="">선택</option>
                {headers.map(h=><option key={h} value={h}>{h}</option>)}
              </select>
            </div>
          </div>
          <div className="field" style={{maxWidth:'50%'}}>
            <label>내용/가맹점 컬럼 (카테고리 자동 추천에 사용)</label>
            <select className="map-select" value={mapping.desc} onChange={e=>setMapping(m=>({...m,desc:e.target.value}))}>
              <option value="">선택</option>
              {headers.map(h=><option key={h} value={h}>{h}</option>)}
            </select>
          </div>
          <div className="field" style={{maxWidth:220}}>
            <label>상단 건너뛸 줄 수 (헤더가 안 맞으면 조정)</label>
            <input type="number" min="0" value={skipRows} onChange={e=>{const v=Number(e.target.value)||0; setSkipRows(v); parseWithSettings(rawFile, encoding, v);}}/>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}>
            <button className="btn-ghost" onClick={()=>{setRows(null);setHeaders([]);setRawFile(null);}}>취소</button>
            <button className="btn-primary" disabled={!mapping.date||!mapping.amount} onClick={buildPreview}>미리보기</button>
          </div>
        </div>
      )}

      {preview.length>0 && (
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <p className="stat-label" style={{margin:0}}>미리보기 — {preview.length}건 (카테고리는 키워드로 자동 추천됐어요, 필요시 수정하세요)</p>
          </div>
          <div style={{maxHeight:380,overflow:'auto'}}>
            <table className="csv-table">
              <thead>
                <tr><th></th><th>날짜</th><th>내용</th><th style={{textAlign:'right'}}>금액</th><th>카테고리</th><th>구분</th><th>입력자</th><th>결제수단</th></tr>
              </thead>
              <tbody>
                {preview.map((r,i)=>(
                  <tr key={r._rowId} style={{opacity:r.include?1:0.4}}>
                    <td><input type="checkbox" checked={r.include} onChange={e=>updatePreviewRow(i,{include:e.target.checked})}/></td>
                    <td className="mono">{r.date}</td>
                    <td>{r.desc}</td>
                    <td className="amount">{fmtWon(r.amount)}</td>
                    <td>
                      <select value={r.categoryId} onChange={e=>{
                        const cat = categories.find(c=>c.id===e.target.value);
                        updatePreviewRow(i,{categoryId:e.target.value, type: cat?cat.type:r.type});
                      }}>
                        {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </td>
                    <td>
                      <select value={r.type} onChange={e=>updatePreviewRow(i,{type:e.target.value})}>
                        <option value="joint">공동</option>
                        <option value="personal">개인</option>
                      </select>
                    </td>
                    <td>
                      <select value={r.who} onChange={e=>updatePreviewRow(i,{who:e.target.value})}>
                        {WHO_OPTIONS.map(w=><option key={w} value={w}>{w}</option>)}
                      </select>
                    </td>
                    <td>
                      <select value={r.paymentMethodId} onChange={e=>updatePreviewRow(i,{paymentMethodId:e.target.value})}>
                        {(paymentMethods||[]).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:16}}>
            <button className="btn-ghost" onClick={()=>{setRows(null);setPreview([]);setHeaders([]);setRawFile(null);}}>취소</button>
            <button className="btn-primary" onClick={confirmImport}>{preview.filter(r=>r.include).length}건 가져오기</button>
          </div>
        </div>
      )}
    </div>
  );
}

function LoanModal({onClose, onSave, initial}){
  const [form,setForm]=useState(initial ? {...initial} : {
    name:'', originalPrincipal:'', remainingPrincipal:'', monthlyPayment:'', interestRate:'',
    currentInstallment:'', totalInstallments:'', lastPaymentDate:'',
    type:'joint', memo:''
  });
  function update(k,v){ setForm(f=>({...f,[k]:v})); }
  function submit(){
    if(!form.name || !form.originalPrincipal || !form.remainingPrincipal) return;
    onSave({
      id: initial?initial.id:'loan_'+Date.now()+Math.random().toString(36).slice(2,7),
      name: form.name,
      originalPrincipal: Number(form.originalPrincipal),
      remainingPrincipal: Number(form.remainingPrincipal),
      monthlyPayment: form.monthlyPayment ? Number(form.monthlyPayment) : null,
      interestRate: form.interestRate ? Number(form.interestRate) : null,
      currentInstallment: form.currentInstallment ? Number(form.currentInstallment) : null,
      totalInstallments: form.totalInstallments ? Number(form.totalInstallments) : null,
      lastPaymentDate: form.lastPaymentDate || null,
      type: form.type,
      memo: form.memo,
    });
  }
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>{initial?'대출 정보 수정':'대출 추가'}</h2>
        <div className="field">
          <label>대출명</label>
          <input value={form.name} onChange={e=>update('name',e.target.value)} placeholder="예: 주택담보대출 (OO은행)"/>
        </div>
        <div className="row-2">
          <div className="field">
            <label>최초 대출 원금</label>
            <input type="number" placeholder="390000000" value={form.originalPrincipal} onChange={e=>update('originalPrincipal',e.target.value)}/>
          </div>
          <div className="field">
            <label>현재 남은 원금</label>
            <input type="number" placeholder="385000000" value={form.remainingPrincipal} onChange={e=>update('remainingPrincipal',e.target.value)}/>
          </div>
        </div>
        <p style={{fontSize:11.5,color:'var(--ink-soft)',marginTop:-8,marginBottom:14}}>남은 원금은 은행 앱/명세서 기준으로 매달 직접 업데이트해주세요 (이자 비중 때문에 자동 계산이 부정확해요).</p>
        <div className="row-2">
          <div className="field">
            <label>월 납입액 (선택)</label>
            <input type="number" placeholder="2600000" value={form.monthlyPayment} onChange={e=>update('monthlyPayment',e.target.value)}/>
          </div>
          <div className="field">
            <label>금리 % (선택)</label>
            <input type="number" step="0.01" placeholder="3.5" value={form.interestRate} onChange={e=>update('interestRate',e.target.value)}/>
          </div>
        </div>
        <div className="row-2">
          <div className="field">
            <label>총 상환 회차 (선택)</label>
            <input type="number" min="1" placeholder="예: 360" value={form.totalInstallments} onChange={e=>update('totalInstallments',e.target.value)}/>
          </div>
          <div className="field">
            <label>현재 몇 회차 (선택)</label>
            <input type="number" min="1" placeholder="예: 7" value={form.currentInstallment} onChange={e=>update('currentInstallment',e.target.value)}/>
          </div>
        </div>
        <div className="field">
          <label>마지막 납입일 (선택)</label>
          <input type="date" value={form.lastPaymentDate||''} onChange={e=>update('lastPaymentDate',e.target.value)}/>
        </div>
        <div className="field">
          <label>공동 / 개인</label>
          <div className="toggle-row">
            <button type="button" className={"toggle-btn"+(form.type==='joint'?' active-joint':'')} onClick={()=>update('type','joint')}>공동</button>
            <button type="button" className={"toggle-btn"+(form.type==='personal'?' active-personal':'')} onClick={()=>update('type','personal')}>개인</button>
          </div>
        </div>
        <div className="field">
          <label>메모</label>
          <input value={form.memo} onChange={e=>update('memo',e.target.value)} placeholder="선택 입력"/>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:20}}>
          <button className="btn-ghost" onClick={onClose}>취소</button>
          <button className="btn-primary" onClick={submit}>저장</button>
        </div>
      </div>
    </div>
  );
}

function Loans({loans, onAdd, onEdit, onDelete}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);

  const totalRemaining = loans.reduce((s,l)=>s+l.remainingPrincipal,0);
  const totalMonthly = loans.reduce((s,l)=>s+(l.monthlyPayment||0),0);

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20}}>
        <div>
          <h1 className="page-title">대출 관리</h1>
          <p className="subtitle" style={{margin:0}}>주택담보대출 등 장기상환 항목의 남은 원금을 직접 관리해요</p>
        </div>
        <button className="btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>+ 대출 추가</button>
      </div>

      {loans.length>0 && (
        <div className="grid-3" style={{marginBottom:20}}>
          <div className="card">
            <p className="stat-label">총 남은 원금</p>
            <p className="stat-value" style={{color:'var(--personal)'}}>{fmtWon(totalRemaining)}</p>
          </div>
          <div className="card">
            <p className="stat-label">월 납입 합계</p>
            <p className="stat-value">{fmtWon(totalMonthly)}</p>
          </div>
          <div className="card">
            <p className="stat-label">등록된 대출</p>
            <p className="stat-value">{loans.length}건</p>
          </div>
        </div>
      )}

      {loans.length===0 ? (
        <div className="card">
          <div className="empty">
            <p className="display">등록된 대출이 없어요</p>
            <p style={{fontSize:13}}>주택담보대출, 학자금대출 등을 추가해서 남은 원금을 추적해보세요.</p>
          </div>
        </div>
      ) : (
        loans.map(l=>{
          const paidRatio = l.originalPrincipal>0 ? Math.min(((l.originalPrincipal-l.remainingPrincipal)/l.originalPrincipal*100),100) : 0;
          return (
            <div key={l.id} className="card" style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontWeight:600,fontSize:14.5}}>{l.name}</span>
                    <span className={"pill "+l.type}>{l.type==='joint'?'공동':'개인'}</span>
                  </div>
                  {l.memo && <p style={{fontSize:12,color:'var(--ink-soft)',marginTop:4}}>{l.memo}</p>}
                </div>
                <div style={{display:'flex',gap:4,whiteSpace:'nowrap'}}>
                  <button className="btn-icon" onClick={()=>{setEditing(l);setShowModal(true);}}>잔액 수정</button>
                  <button className="btn-icon" onClick={()=>{ if(window.confirm('이 대출을 삭제할까요?')) onDelete(l.id); }}>삭제</button>
                </div>
              </div>
              <div className="grid-3" style={{marginBottom:10}}>
                <div>
                  <p className="stat-label">남은 원금</p>
                  <p className="stat-value" style={{fontSize:18,color:'var(--personal)'}}>{fmtWon(l.remainingPrincipal)}</p>
                </div>
                <div>
                  <p className="stat-label">최초 원금</p>
                  <p className="stat-value" style={{fontSize:18}}>{fmtWon(l.originalPrincipal)}</p>
                </div>
                <div>
                  <p className="stat-label">월 납입액{l.interestRate?` · 금리 ${l.interestRate}%`:''}</p>
                  <p className="stat-value" style={{fontSize:18}}>{l.monthlyPayment?fmtWon(l.monthlyPayment):'—'}</p>
                </div>
              </div>
              {(l.currentInstallment || l.lastPaymentDate) && (
                <p style={{fontSize:12,color:'var(--ink-soft)',marginBottom:8}}>
                  {l.currentInstallment && l.totalInstallments ? `${l.currentInstallment}/${l.totalInstallments}회` : (l.currentInstallment ? `${l.currentInstallment}회차` : '')}
                  {l.lastPaymentDate ? ` · 마지막 납입 ${l.lastPaymentDate}` : ''}
                </p>
              )}
              <div style={{height:8,background:'var(--line)',borderRadius:99}}>
                <div style={{height:8,width:paidRatio+'%',background:'var(--joint)',borderRadius:99}}></div>
              </div>
              <p style={{fontSize:11.5,color:'var(--ink-soft)',marginTop:6}}>{paidRatio.toFixed(1)}% 상환 완료</p>
            </div>
          );
        })
      )}

      {showModal && (
        <LoanModal
          initial={editing}
          onClose={()=>setShowModal(false)}
          onSave={(l)=>{ editing?onEdit(l):onAdd(l); setShowModal(false); }}
        />
      )}
    </div>
  );
}

        <div className="row-2">
          <div className="field">
            <label>날짜</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>

function Assets({assets, snapshots, onAdd, onEdit, onDelete, onAddSnapshot}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [snapshotFor,setSnapshotFor]=useState(null);

  const totalAssets = assets.reduce((s,a)=>s+a.currentValue,0);
  const totalPrincipal = assets.reduce((s,a)=>s+(a.principalInvested||0),0);

  const snapshotsFor = (assetId) => (snapshots||[]).filter(s=>s.assetId===assetId).sort((a,b)=>b.date.localeCompare(a.date));

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20}}>
        <div>
          <h1 className="page-title">저축/투자 관리</h1>
          <p className="subtitle" style={{margin:0}}>예적금, 주식, 비상금 등 우리 자산의 흐름을 추적해요</p>
        </div>
        <button className="btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>+ 자산 추가</button>
      </div>

      {assets.length>0 && (
        <div className="grid-3" style={{marginBottom:20}}>
          <div className="card">
            <p className="stat-label">총 자산</p>
            <p className="stat-value" style={{color:'var(--joint)'}}>{fmtWon(totalAssets)}</p>
          </div>
          <div className="card">
            <p className="stat-label">총 납입 원금</p>
            <p className="stat-value">{totalPrincipal>0?fmtWon(totalPrincipal):'—'}</p>
          </div>
          <div className="card">
            <p className="stat-label">평가손익</p>
            <p className="stat-value" style={{color: (totalAssets-totalPrincipal)>=0?'var(--joint)':'var(--danger)'}}>
              {totalPrincipal>0 ? fmtWon(totalAssets-totalPrincipal) : '—'}
            </p>
          </div>
        </div>
      )}

      {assets.length===0 ? (
        <div className="card">
          <div className="empty">
            <p className="display">등록된 자산이 없어요</p>
            <p style={{fontSize:13}}>예적금, 주식, 비상금 통장 등을 추가해서 자산이 늘어나는 걸 추적해보세요.</p>
          </div>
        </div>
      ) : (
        assets.map(a=>{
          const gain = a.principalInvested ? a.currentValue - a.principalInvested : null;
          const gainPct = a.principalInvested ? (gain/a.principalInvested*100) : null;
          const hist = snapshotsFor(a.id);
          return (
            <div key={a.id} className="card" style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span style={{fontWeight:600,fontSize:14.5}}>{a.name}</span>
                    <span className="pill gold" style={{background:'var(--gold-soft)',color:'#8a6d10'}}>{ASSET_TYPE_LABELS[a.assetType]||a.assetType}</span>
                    <span className={"pill "+a.scope}>{a.scope==='joint'?'공동':'개인'}</span>
                  </div>
                  {a.memo && <p style={{fontSize:12,color:'var(--ink-soft)',marginTop:4}}>{a.memo}</p>}
                </div>
                <div style={{display:'flex',gap:4,whiteSpace:'nowrap'}}>
                  <button className="btn-icon" onClick={()=>setSnapshotFor(a)}>기록 추가</button>
                  <button className="btn-icon" onClick={()=>{setEditing(a);setShowModal(true);}}>수정</button>
                  <button className="btn-icon" onClick={()=>{ if(window.confirm('이 자산을 삭제할까요? 기록된 히스토리도 함께 삭제돼요.')) onDelete(a.id); }}>삭제</button>
                </div>
              </div>
              <div className="grid-3" style={{marginBottom:10}}>
                <div>
                  <p className="stat-label">현재 평가금액{a.asOfDate?` (${a.asOfDate} 기준)`:''}</p>
                  <p className="stat-value" style={{fontSize:18,color:'var(--joint)'}}>{fmtWon(a.currentValue)}</p>
                </div>
                <div>
                  <p className="stat-label">납입 원금</p>
                  <p className="stat-value" style={{fontSize:18}}>{a.principalInvested?fmtWon(a.principalInvested):'—'}</p>
                </div>
                <div>
                  <p className="stat-label">평가손익</p>
                  <p className="stat-value" style={{fontSize:18,color:gain==null?'var(--ink)':(gain>=0?'var(--joint)':'var(--danger)')}}>
                    {gain==null?'—':`${gain>=0?'+':''}${fmtWon(gain)} (${gainPct.toFixed(1)}%)`}
                  </p>
                </div>
              </div>
              {hist.length>0 && (
                <div style={{marginTop:10}}>
                  <p className="stat-label" style={{marginBottom:6}}>최근 기록</p>
                  {hist.slice(0,5).map(s=>(
                    <div key={s.id} style={{display:'flex',justifyContent:'space-between',fontSize:12.5,padding:'4px 0',borderBottom:'1px solid var(--line)'}}>
                      <span className="mono">{s.date}</span>
                      <span className="mono">{fmtWon(s.value)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })
      )}

      {showModal && (
        <AssetModal
          initial={editing}
          onClose={()=>setShowModal(false)}
          onSave={(a)=>{ editing?onEdit(a):onAdd(a); setShowModal(false); }}
        />
      )}
      {snapshotFor && (
        <SnapshotModal
          assetName={snapshotFor.name}
          onClose={()=>setSnapshotFor(null)}
          onSave={({date,value})=>{ onAddSnapshot(snapshotFor.id, date, value); setSnapshotFor(null); }}
        />
      )}
    </div>
  );
}

function RecurringExpenseModal({categories, paymentMethods, onClose, onSave, initial}){
  const [form,setForm]=useState(initial ? {...initial} : {
    name:'', kind:'fixed', amount:'', categoryId: categories[0]?.id||'', type:'',
    who: WHO_OPTIONS[0], paymentMethodId: (paymentMethods&&paymentMethods[0]?.id)||'cash',
    totalMonths:'', paidCount:0, memo:''
  });
  const selectedCat = categories.find(c=>c.id===form.categoryId);
  const effectiveType = form.type || (selectedCat?selectedCat.type:'joint');
  function update(k,v){ setForm(f=>({...f,[k]:v})); }
  function submit(){
    if(!form.name || !form.amount) return;
    if(form.kind==='installment' && !form.totalMonths) return;
    onSave({
      id: initial?initial.id:'rec_'+Date.now()+Math.random().toString(36).slice(2,7),
      name: form.name, kind: form.kind, amount: Number(form.amount),

      paymentMethodId: form.paymentMethodId,

      lastPaidMonth: initial?initial.lastPaidMonth:null,
      active: initial ? initial.active : true,
      originTransactionId: initial?initial.originTransactionId:null,

        </div>
        <div className="row-2">
          <div className="field">
            <label>{form.kind==='installment'?'월 할부금':'월 금액'}</label>
            <input type="number" placeholder="15000" value={form.amount} onChange={e=>update('amount',e.target.value)}/>
