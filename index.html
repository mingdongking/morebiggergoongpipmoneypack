function RecurringExpenses({recurringExpenses, categories, paymentMethods, transactions, onAdd, onEdit, onDelete, onPay, onMigrate}){
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [showInactive,setShowInactive]=useState(false);

  const curMonth = new Date().toISOString().slice(0,7);
  const catName = id => categories.find(c=>c.id===id)?.name || id;

  const migratable = transactions.filter(t=>
    (t.flow||'expense')==='expense' && t.isInstallment && t.installmentTotalMonths && t.installmentCurrentMonth &&
    !recurringExpenses.some(r=>r.originTransactionId===t.id)
  );

  const visible = recurringExpenses.filter(r=>showInactive || r.active);
  const activeTotal = recurringExpenses.filter(r=>r.active).reduce((s,r)=>s+r.amount,0);
  const paidThisMonth = recurringExpenses.filter(r=>r.active && r.lastPaidMonth===curMonth).length;
  const activeCount = recurringExpenses.filter(r=>r.active).length;

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20,flexWrap:'wrap',gap:10}}>
        <div>
          <h1 className="page-title">고정지출 / 할부 관리</h1>
          <p className="subtitle" style={{margin:0}}>구독료, 월세, 카드 할부처럼 매달 반복되는 지출을 한 번 등록해두고 버튼으로 처리해요</p>
        </div>
        <button className="btn-primary" onClick={()=>{setEditing(null);setShowModal(true);}}>+ 새 항목 추가</button>
      </div>

      {migratable.length>0 && (
        <div className="card" style={{marginBottom:16,background:'var(--gold-soft)',border:'1px solid var(--gold)'}}>
          <p style={{fontSize:13.5,marginBottom:8}}><strong>{migratable.length}건</strong>의 기존 할부 거래를 이 시스템으로 옮길 수 있어요 (진행 상황 그대로 가져와요).</p>
          <button className="btn-primary" onClick={()=>onMigrate(migratable)}>기존 할부 거래 마이그레이션</button>
        </div>
      )}

      {recurringExpenses.length>0 && (
        <div className="grid-3" style={{marginBottom:20}}>
          <div className="card">
            <p className="stat-label">활성 항목 월 합계</p>
            <p className="stat-value" style={{fontSize:19}}>{fmtWon(activeTotal)}</p>
          </div>
          <div className="card">
            <p className="stat-label">이번 달 처리 현황</p>
            <p className="stat-value" style={{fontSize:19}}>{paidThisMonth}/{activeCount}건</p>
          </div>
          <div className="card">
            <p className="stat-label">전체 등록 항목</p>
            <p className="stat-value" style={{fontSize:19}}>{recurringExpenses.length}건</p>
          </div>
        </div>
      )}

      <div style={{marginBottom:12}}>
        <label style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12.5,color:'var(--ink-soft)',cursor:'pointer'}}>
          <input type="checkbox" style={{width:'auto'}} checked={showInactive} onChange={e=>setShowInactive(e.target.checked)}/>
          비활성/완료된 항목도 보기
        </label>
      </div>

      {visible.length===0 ? (
        <div className="card">
          <div className="empty">
            <p className="display">등록된 항목이 없어요</p>
            <p style={{fontSize:13}}>구독료나 할부 결제를 추가해보세요.</p>
          </div>
        </div>
      ) : (
        visible.map(r=>{
          const paidThis = r.lastPaidMonth===curMonth;
          const progress = r.kind==='installment' && r.totalMonths ? Math.min(r.paidCount/r.totalMonths*100,100) : null;
          return (
            <div key={r.id} className="card" style={{marginBottom:14, opacity:r.active?1:0.55}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10,flexWrap:'wrap',gap:8}}>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span style={{fontWeight:600,fontSize:14.5}}>{r.name}</span>
                    <span className="pill" style={{background:r.kind==='installment'?'var(--gold-soft)':'var(--joint-soft)',color:r.kind==='installment'?'#8a6d10':'var(--joint)'}}>
                      {r.kind==='installment'?'할부':'고정지출'}
                    </span>
                    <span className={"pill "+r.type}>{r.type==='joint'?'공동':'개인'}</span>
                    {!r.active && <span className="pill" style={{background:'var(--line)',color:'var(--ink-soft)'}}>비활성</span>}
                  </div>
                  <p style={{fontSize:12,color:'var(--ink-soft)',marginTop:4}}>
                    {catName(r.categoryId)} · {r.who}
                    {r.kind==='installment' && r.totalMonths ? ` · ${r.paidCount}/${r.totalMonths}회` : ''}
                  </p>
                </div>
                <div style={{display:'flex',gap:4,whiteSpace:'nowrap'}}>
                  {r.active && (
                    <button className="btn-primary" style={{padding:'8px 14px',fontSize:12.5}} disabled={paidThis} onClick={()=>onPay(r)}>
                      {paidThis?'이번 달 완료':'이번 달 납부 처리'}
                    </button>
                  )}
                  <button className="btn-icon" onClick={()=>{setEditing(r);setShowModal(true);}}>수정</button>
                  <button className="btn-icon" onClick={()=>{ if(window.confirm('삭제할까요? (이미 생성된 거래 기록은 안 지워져요)')) onDelete(r.id); }}>삭제</button>
                </div>
              </div>
              <p className="stat-value" style={{fontSize:18}}>{fmtWon(r.amount)}<span style={{fontSize:12,color:'var(--ink-soft)',fontWeight:400}}> / 월</span></p>
              {progress!=null && (
                <div style={{marginTop:8}}>
                  <div style={{height:6,background:'var(--line)',borderRadius:99}}>
                    <div style={{height:6,width:progress+'%',background:'var(--gold)',borderRadius:99}}></div>
                  </div>
                </div>
              )}
            </div>
          );
        })
      )}

      {showModal && (
        <RecurringExpenseModal
          categories={categories}
          paymentMethods={paymentMethods}
          initial={editing}
          onClose={()=>setShowModal(false)}
          onSave={(r)=>{ editing?onEdit(r):onAdd(r); setShowModal(false); }}
        />
      )}
    </div>
  );
}

function CategorySettings({categories, setCategories}){
  const [newKeyword, setNewKeyword] = useState({});

  function updateCat(id, patch){
    setCategories(cs=>cs.map(c=>c.id===id?{...c,...patch}:c));
  }
  function addKeyword(id){
    const kw = (newKeyword[id]||'').trim();
    if(!kw) return;
    updateCat(id,{keywords:[...(categories.find(c=>c.id===id).keywords),kw]});
    setNewKeyword(n=>({...n,[id]:''}));
  }
  function removeKeyword(id, kw){
    updateCat(id,{keywords: categories.find(c=>c.id===id).keywords.filter(k=>k!==kw)});
  }
  function addCategory(){
    const name = prompt('새 카테고리 이름');
    if(!name) return;
    setCategories(cs=>[...cs,{id:'cat_'+Date.now(), name, type:'personal', keywords:[]}]);
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20}}>
        <div>
          <h1 className="page-title">카테고리 설정</h1>
          <p className="subtitle" style={{margin:0}}>카테고리별 공동/개인 기본값과 CSV 자동분류용 키워드를 관리해요.</p>
        </div>
        <button className="btn-primary" onClick={addCategory}>+ 카테고리 추가</button>
      </div>

      <div className="card">
        {categories.map(c=>(
          <div key={c.id} style={{padding:'14px 0',borderBottom:'1px solid var(--line)'}}>
            <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:8}}>
              <span className="cat-name" style={{minWidth:130}}>{c.name}</span>
              <div className="toggle-row" style={{maxWidth:180}}>
                <button className={"toggle-btn"+(c.type==='joint'?' active-joint':'')} onClick={()=>updateCat(c.id,{type:'joint'})}>공동</button>
                <button className={"toggle-btn"+(c.type==='personal'?' active-personal':'')} onClick={()=>updateCat(c.id,{type:'personal'})}>개인</button>
              </div>
            </div>
            <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:4}}>
              {c.keywords.map(kw=>(
                <span key={kw} className="keyword-tag">{kw}<button onClick={()=>removeKeyword(c.id,kw)}>×</button></span>
              ))}
              <input
                placeholder="키워드 추가 후 Enter"
                style={{width:150,padding:'4px 8px',fontSize:12}}
                value={newKeyword[c.id]||''}
                onChange={e=>setNewKeyword(n=>({...n,[c.id]:e.target.value}))}
                onKeyDown={e=>{ if(e.key==='Enter'){ addKeyword(c.id); } }}
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const isOnline = !!supabase;
  const [state,setState]=useState(isOnline ? {transactions:[], categories:[], loans:[], paymentMethods:[], assets:[], assetSnapshots:[], recurringExpenses:[]} : {loans:[], paymentMethods:[], assets:[], assetSnapshots:[], recurringExpenses:[], ...loadLocal()});
  const [tab,setTab]=useState('dashboard');
  const [mobileMenuOpen,setMobileMenuOpen]=useState(false);
  const [syncStatus,setSyncStatus]=useState(isOnline ? 'connecting' : 'local');

  // 로컬 폴백 저장
  useEffect(()=>{ if(!isOnline) saveLocal(state); },[state, isOnline]);

  // 최초 로드 + 실시간 구독
  useEffect(()=>{
    if(!isOnline) return;
    let cancelled = false;

    async function init(){
      const [{data:cats, error:catErr}, {data:txs, error:txErr}, {data:loans, error:loanErr}, {data:pms, error:pmErr}, {data:assets, error:assetErr}, {data:snaps, error:snapErr}, {data:recs, error:recErr}] = await Promise.all([
        supabase.from('categories').select('*').order('created_at'),
        supabase.from('transactions').select('*').order('date',{ascending:false}),
        supabase.from('loans').select('*').order('created_at'),
        supabase.from('payment_methods').select('*').order('created_at'),
        supabase.from('assets').select('*').order('created_at'),
        supabase.from('asset_snapshots').select('*').order('date'),
        supabase.from('recurring_expenses').select('*').order('created_at'),
      ]);
      if(cancelled) return;
      if(catErr || txErr || loanErr || pmErr || assetErr || snapErr || recErr){ console.error(catErr||txErr||loanErr||pmErr||assetErr||snapErr||recErr); setSyncStatus('error'); return; }
      setState({
        categories: (cats||[]).map(dbToCat),
        transactions: (txs||[]).map(dbToTx),
        loans: (loans||[]).map(dbToLoan),
        paymentMethods: (pms||[]).map(dbToPM),
        assets: (assets||[]).map(dbToAsset),
        assetSnapshots: (snaps||[]).map(dbToSnapshot),
        recurringExpenses: (recs||[]).map(dbToRecurring),
      });
      setSyncStatus('live');
    }
    init();

    const channel = supabase.channel('ledger-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'transactions'}, payload=>{
        setState(s=>{
          if(payload.eventType==='INSERT'){
            if(s.transactions.some(t=>t.id===payload.new.id)) return s;
            return {...s, transactions:[dbToTx(payload.new), ...s.transactions]};
          }
          if(payload.eventType==='UPDATE'){
            return {...s, transactions:s.transactions.map(t=>t.id===payload.new.id?dbToTx(payload.new):t)};
          }
          if(payload.eventType==='DELETE'){
            return {...s, transactions:s.transactions.filter(t=>t.id!==payload.old.id)};
          }
          return s;
        });
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'categories'}, payload=>{
        setState(s=>{
          if(payload.eventType==='INSERT'){
            if(s.categories.some(c=>c.id===payload.new.id)) return s;
            return {...s, categories:[...s.categories, dbToCat(payload.new)]};
          }
          if(payload.eventType==='UPDATE'){
            return {...s, categories:s.categories.map(c=>c.id===payload.new.id?dbToCat(payload.new):c)};
          }
          if(payload.eventType==='DELETE'){
            return {...s, categories:s.categories.filter(c=>c.id!==payload.old.id)};
          }
          return s;
        });
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'loans'}, payload=>{
        setState(s=>{
          if(payload.eventType==='INSERT'){
            if(s.loans.some(l=>l.id===payload.new.id)) return s;
            return {...s, loans:[...s.loans, dbToLoan(payload.new)]};
          }
          if(payload.eventType==='UPDATE'){
            return {...s, loans:s.loans.map(l=>l.id===payload.new.id?dbToLoan(payload.new):l)};
          }
          if(payload.eventType==='DELETE'){
            return {...s, loans:s.loans.filter(l=>l.id!==payload.old.id)};
          }
          return s;
        });
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'payment_methods'}, payload=>{
        setState(s=>{
          if(payload.eventType==='INSERT'){
            if(s.paymentMethods.some(p=>p.id===payload.new.id)) return s;
            return {...s, paymentMethods:[...s.paymentMethods, dbToPM(payload.new)]};
          }
          if(payload.eventType==='UPDATE'){
            return {...s, paymentMethods:s.paymentMethods.map(p=>p.id===payload.new.id?dbToPM(payload.new):p)};
          }
          if(payload.eventType==='DELETE'){
            return {...s, paymentMethods:s.paymentMethods.filter(p=>p.id!==payload.old.id)};
          }
          return s;
        });
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'assets'}, payload=>{
        setState(s=>{
          if(payload.eventType==='INSERT'){
            if(s.assets.some(a=>a.id===payload.new.id)) return s;
            return {...s, assets:[...s.assets, dbToAsset(payload.new)]};
          }
          if(payload.eventType==='UPDATE'){
            return {...s, assets:s.assets.map(a=>a.id===payload.new.id?dbToAsset(payload.new):a)};
          }
          if(payload.eventType==='DELETE'){
            return {...s, assets:s.assets.filter(a=>a.id!==payload.old.id)};
          }
          return s;
        });
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'asset_snapshots'}, payload=>{
        setState(s=>{
          if(payload.eventType==='INSERT'){
            if(s.assetSnapshots.some(sn=>sn.id===payload.new.id)) return s;
            return {...s, assetSnapshots:[...s.assetSnapshots, dbToSnapshot(payload.new)]};
          }
          if(payload.eventType==='DELETE'){
            return {...s, assetSnapshots:s.assetSnapshots.filter(sn=>sn.id!==payload.old.id)};
          }
          return s;
        });
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'recurring_expenses'}, payload=>{
        setState(s=>{
          if(payload.eventType==='INSERT'){
            if(s.recurringExpenses.some(r=>r.id===payload.new.id)) return s;
            return {...s, recurringExpenses:[...s.recurringExpenses, dbToRecurring(payload.new)]};
          }
          if(payload.eventType==='UPDATE'){
            return {...s, recurringExpenses:s.recurringExpenses.map(r=>r.id===payload.new.id?dbToRecurring(payload.new):r)};
          }
          if(payload.eventType==='DELETE'){
            return {...s, recurringExpenses:s.recurringExpenses.filter(r=>r.id!==payload.old.id)};
          }
          return s;
        });
      })
      .subscribe();

    return ()=>{ cancelled=true; supabase.removeChannel(channel); };
  },[isOnline]);

  // ---- 거래 CRUD ----
  async function addTx(tx){
    if(isOnline){
      setState(s=>({...s, transactions:[tx, ...s.transactions]})); // 낙관적 반영
      const {error} = await supabase.from('transactions').insert([txToDb(tx)]);
      if(error) console.error(error);
    } else {
      setState(s=>({...s, transactions:[...s.transactions, tx]}));
    }
  }
  async function editTx(tx){
    setState(s=>({...s, transactions:s.transactions.map(t=>t.id===tx.id?tx:t)}));
    if(isOnline){
      const {error} = await supabase.from('transactions').update(txToDb(tx)).eq('id',tx.id);
      if(error) console.error(error);
    }
  }
  async function deleteTx(id){
    setState(s=>({...s, transactions:s.transactions.filter(t=>t.id!==id)}));
    if(isOnline){
      const {error} = await supabase.from('transactions').delete().eq('id',id);
      if(error) console.error(error);
    }
  }
  async function importTx(list){
    if(isOnline){
      setState(s=>({...s, transactions:[...list, ...s.transactions]}));
      const {error} = await supabase.from('transactions').insert(list.map(txToDb));
      if(error) console.error(error);
    } else {
      setState(s=>({...s, transactions:[...s.transactions, ...list]}));
    }
  }
  // ---- 카테고리 CRUD ----
  async function setCategories(fn){
    const prevCats = state.categories;
    const nextCats = typeof fn==='function'?fn(prevCats):fn;
    setState(s=>({...s, categories: nextCats}));
    if(!isOnline) return;
    // 변경분/신규분만 upsert
    const prevIds = new Set(prevCats.map(c=>c.id));
    for(const c of nextCats){
      const prev = prevCats.find(p=>p.id===c.id);
      if(!prev || JSON.stringify(prev)!==JSON.stringify(c)){
        const {error} = await supabase.from('categories').upsert({id:c.id,name:c.name,type:c.type,keywords:c.keywords});
        if(error) console.error(error);
      }
    }
  }

  // ---- 대출 CRUD ----
  async function addLoan(l){
    if(isOnline){
      setState(s=>({...s, loans:[...s.loans, l]}));
      const {error} = await supabase.from('loans').insert([loanToDb(l)]);
      if(error) console.error(error);
    } else {
      setState(s=>({...s, loans:[...s.loans, l]}));
    }
  }
  async function editLoan(l){
    setState(s=>({...s, loans:s.loans.map(x=>x.id===l.id?l:x)}));
    if(isOnline){
      const {error} = await supabase.from('loans').update(loanToDb(l)).eq('id',l.id);
      if(error) console.error(error);
    }
  }
  async function deleteLoan(id){
    setState(s=>({...s, loans:s.loans.filter(l=>l.id!==id)}));
    if(isOnline){
      const {error} = await supabase.from('loans').delete().eq('id',id);
      if(error) console.error(error);
    }
  }

  // ---- 고정지출/할부 CRUD ----
  async function addRecurring(r){
    setState(s=>({...s, recurringExpenses:[...s.recurringExpenses, r]}));
    if(isOnline){
      const {error} = await supabase.from('recurring_expenses').insert([recurringToDb(r)]);
      if(error) console.error(error);
    }
  }
  async function editRecurring(r){
    setState(s=>({...s, recurringExpenses:s.recurringExpenses.map(x=>x.id===r.id?r:x)}));
    if(isOnline){
      const {error} = await supabase.from('recurring_expenses').update(recurringToDb(r)).eq('id',r.id);
      if(error) console.error(error);
    }
  }
  async function deleteRecurring(id){
    setState(s=>({...s, recurringExpenses:s.recurringExpenses.filter(r=>r.id!==id)}));
    if(isOnline){
      const {error} = await supabase.from('recurring_expenses').delete().eq('id',id);
      if(error) console.error(error);
    }
  }
  async function payRecurring(r){
    const curMonthKey = new Date().toISOString().slice(0,7);
    const tx = {
      id:'tx_'+Date.now()+Math.random().toString(36).slice(2,7),
      date: todayISO(), amount: r.amount, categoryId: r.categoryId, type: r.type, who: r.who,
      memo: r.name, source:'recurring', flow:'expense', paymentMethodId: r.paymentMethodId,
      isInstallment:false, installmentPrincipal:null, installmentTotalMonths:null, installmentCurrentMonth:null,
      recurringExpenseId: r.id,
    };
    await addTx(tx);
    const newPaidCount = (r.paidCount||0)+1;
    const newActive = r.kind==='installment' ? (newPaidCount < r.totalMonths) : true;
    await editRecurring({...r, paidCount:newPaidCount, lastPaidMonth: curMonthKey, active: newActive});
  }
  async function migrateInstallments(list){
    for(let i=0;i<list.length;i++){
      const tx = list[i];
      const rec = {
        id:'rec_'+Date.now()+'_'+i+Math.random().toString(36).slice(2,5),
        name: tx.memo || (state.categories.find(c=>c.id===tx.categoryId)?.name) || '할부',
        kind:'installment', amount: tx.amount,
        categoryId: tx.categoryId, type: tx.type, who: tx.who,
        paymentMethodId: tx.paymentMethodId||null,
        totalMonths: tx.installmentTotalMonths, paidCount: tx.installmentCurrentMonth,
        lastPaidMonth: monthKey(tx.date),
        active: tx.installmentCurrentMonth < tx.installmentTotalMonths,
        originTransactionId: tx.id, memo:null,
      };
      await addRecurring(rec);
      await editTx({...tx, isInstallment:false, installmentPrincipal:null, installmentTotalMonths:null, installmentCurrentMonth:null});
    }
  }

  // ---- 결제수단 CRUD ----
  async function addPM(p){
    setState(s=>({...s, paymentMethods:[...s.paymentMethods, p]}));
    if(isOnline){
      const {error} = await supabase.from('payment_methods').insert([pmToDb(p)]);
      if(error) console.error(error);
    }
  }
  async function editPM(p){
    setState(s=>({...s, paymentMethods:s.paymentMethods.map(x=>x.id===p.id?p:x)}));
    if(isOnline){
      const {error} = await supabase.from('payment_methods').update(pmToDb(p)).eq('id',p.id);
      if(error) console.error(error);
    }
  }
  async function deletePM(id){
    setState(s=>({...s, paymentMethods:s.paymentMethods.filter(p=>p.id!==id)}));
    if(isOnline){
      const {error} = await supabase.from('payment_methods').delete().eq('id',id);
      if(error) console.error(error);
    }
  }

  // ---- 자산 CRUD ----
  async function addAsset(a){
    setState(s=>({...s, assets:[...s.assets, a]}));
    const snap = {id:'snap_'+Date.now()+Math.random().toString(36).slice(2,7), assetId:a.id, date:a.asOfDate, value:a.currentValue};
    setState(s=>({...s, assetSnapshots:[...s.assetSnapshots, snap]}));
    if(isOnline){
      const {error:e1} = await supabase.from('assets').insert([assetToDb(a)]);
      if(e1) console.error(e1);
      const {error:e2} = await supabase.from('asset_snapshots').insert([snapshotToDb(snap)]);
      if(e2) console.error(e2);
    }
  }
  async function editAsset(a){
    setState(s=>({...s, assets:s.assets.map(x=>x.id===a.id?a:x)}));
    const snap = {id:'snap_'+Date.now()+Math.random().toString(36).slice(2,7), assetId:a.id, date:a.asOfDate, value:a.currentValue};
    setState(s=>({...s, assetSnapshots:[...s.assetSnapshots, snap]}));
    if(isOnline){
      const {error:e1} = await supabase.from('assets').update(assetToDb(a)).eq('id',a.id);
      if(e1) console.error(e1);
      const {error:e2} = await supabase.from('asset_snapshots').insert([snapshotToDb(snap)]);
      if(e2) console.error(e2);
    }
  }
  async function deleteAsset(id){
    setState(s=>({...s, assets:s.assets.filter(a=>a.id!==id), assetSnapshots:s.assetSnapshots.filter(sn=>sn.assetId!==id)}));
    if(isOnline){
      const {error} = await supabase.from('assets').delete().eq('id',id);
      if(error) console.error(error);
    }
  }
  async function addAssetSnapshot(assetId, date, value){
    const snap = {id:'snap_'+Date.now()+Math.random().toString(36).slice(2,7), assetId, date, value};
    setState(s=>({...s, assetSnapshots:[...s.assetSnapshots, snap]}));
    if(isOnline){
      const {error} = await supabase.from('asset_snapshots').insert([snapshotToDb(snap)]);
      if(error) console.error(error);
    }
  }

  return (
    <div className="app">
      <Sidebar tab={tab} setTab={setTab} mobileOpen={mobileMenuOpen} setMobileOpen={setMobileMenuOpen}/>
      <div className="main">
        <SyncBadge status={syncStatus}/>
        {tab==='dashboard' && <Dashboard transactions={state.transactions} categories={state.categories} loans={state.loans} paymentMethods={state.paymentMethods} assets={state.assets} recurringExpenses={state.recurringExpenses}/>}
        {tab==='transactions' && <Transactions transactions={state.transactions} categories={state.categories} paymentMethods={state.paymentMethods} onAdd={addTx} onEdit={editTx} onDelete={deleteTx}/>}
        {tab==='recurring' && <RecurringExpenses recurringExpenses={state.recurringExpenses} categories={state.categories} paymentMethods={state.paymentMethods} transactions={state.transactions} onAdd={addRecurring} onEdit={editRecurring} onDelete={deleteRecurring} onPay={payRecurring} onMigrate={migrateInstallments}/>}
        {tab==='loans' && <Loans loans={state.loans} onAdd={addLoan} onEdit={editLoan} onDelete={deleteLoan}/>}
        {tab==='assets' && <Assets assets={state.assets} snapshots={state.assetSnapshots} onAdd={addAsset} onEdit={editAsset} onDelete={deleteAsset} onAddSnapshot={addAssetSnapshot}/>}
        {tab==='paymentMethods' && <PaymentMethods paymentMethods={state.paymentMethods} onAdd={addPM} onEdit={editPM} onDelete={deletePM}/>}
        {tab==='csv' && <CsvUpload categories={state.categories} paymentMethods={state.paymentMethods} onImport={importTx}/>}
        {tab==='categories' && <CategorySettings categories={state.categories} setCategories={setCategories}/>}
      </div>
    </div>
  );
}

function SyncBadge({status}){
  const map = {
    local:{label:'로컬 저장 모드 (Supabase 미연결)', color:'var(--ink-soft)'},
    connecting:{label:'연결 중…', color:'var(--gold)'},
    live:{label:'실시간 동기화 중', color:'var(--joint)'},
    error:{label:'동기화 오류 — 콘솔 확인', color:'var(--danger)'},
  };
  const s = map[status]||map.local;
  return (
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:16,fontSize:12,color:s.color}}>
      <span style={{width:7,height:7,borderRadius:99,background:s.color,display:'inline-block'}}></span>
      {s.label}
    </div>
  );
}

function LockScreen({onUnlock}){
  const [value,setValue] = useState('');
  const [error,setError] = useState(false);
  function submit(e){
    e.preventDefault();
    if(value && ANNIVERSARY_DATE!=='00000000' && value===ANNIVERSARY_DATE){
      onUnlock();
    } else {
      setError(true);
    }
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <form onSubmit={submit} className="card" style={{width:'min(360px,92vw)',textAlign:'center',padding:'36px 28px'}}>
        <p style={{fontSize:28,marginBottom:8}}>🔒</p>
        <p className="display" style={{fontSize:17,fontWeight:700,marginBottom:6}}>더커진궁핍한돈주머니</p>
        <p style={{fontSize:14,color:'var(--ink-soft)',marginBottom:4}}>결혼기념일을 대시오</p>
        <p style={{fontSize:11.5,color:'var(--ink-soft)',marginBottom:18}}>8개 숫자를 입력하세요</p>
        <input
          type="text"
          inputMode="numeric"
          pattern="[0-9]*"
          maxLength={8}
          placeholder="········"
          value={value}
          onChange={e=>{setValue(e.target.value.replace(/[^0-9]/g,'').slice(0,8)); setError(false);}}
          style={{marginBottom:14,textAlign:'center',letterSpacing:'2px',fontFamily:"'JetBrains Mono',monospace"}}
          autoFocus
        />
        {error && <p style={{fontSize:12.5,color:'var(--danger)',marginBottom:12}}>땡! 다시 생각해보세요 🤔</p>}
        <button type="submit" className="btn-primary" style={{width:'100%'}}>입장하기</button>
      </form>
    </div>
  );
}

function Gate(){
  const [unlocked,setUnlocked] = useState(()=>{
    try{ return localStorage.getItem('anniv_unlocked')==='1'; }catch(e){ return false; }
  });
  if(!unlocked){
    return <LockScreen onUnlock={()=>{
      try{ localStorage.setItem('anniv_unlocked','1'); }catch(e){}
      setUnlocked(true);
    }}/>;
  }
  return <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Gate/>);
</script>
</body>
</html>
